    <script>
      // Runs before first paint: a theme applied from React would flash the
      // default palette for a frame first. Deliberately inline and tiny — an
      // external file would be another blocking request in front of paint.
      (function () {
        try {
          var stored = localStorage.getItem('portfolio:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#fbfbf9' : '#0a0c0f');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
